<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 审计日志 — 桌面运维助手</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --primary:#4a6cf7;--primary-hover:#3a5de7;
  --bg:#f0f2f5;--bg-card:#fff;--text:#1a1a2e;--text-secondary:#6c757d;--border:#e2e8f0;
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --success:#28a745;--danger:#dc3545;--warn:#ffc107;
}
[data-theme="dark"]{
  --bg:#0f1419;--bg-card:#1a2027;--text:#e1e7ef;--text-secondary:#8b93a1;--border:#2d353f;--shadow:0 4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px;transition:background .3s,color .3s}
.container{max-width:960px;margin:0 auto}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-header a{text-decoration:none;color:var(--primary);font-weight:600;font-size:15px}
.page-header h1{font-size:24px;margin-left:auto;color:var(--text)}
.card{background:var(--bg-card);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar select,.toolbar input{padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg-card);color:var(--text);outline:none}
.toolbar select:focus,.toolbar input:focus{border-color:var(--primary)}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#c82333}
.summary{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px}
.summary .stat{flex:1;min-width:120px;background:var(--bg-card);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow);text-align:center}
.summary .stat .num{font-size:26px;font-weight:700;color:var(--primary)}
.summary .stat .label{font-size:12px;color:var(--text-secondary);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);color:var(--text-secondary);padding:10px 12px;text-align:left;font-weight:600;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:rgba(74,108,247,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:#d4edda;color:#155724}
.badge.fail{background:#f8d7da;color:#721c24}
.mono{font-family:'Consolas',monospace;font-size:12px;word-break:break-all}
.result-cell{max-width:380px;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;top:20px;right:20px;background:var(--bg-card);color:var(--text);border:1px solid var(--border);padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;z-index:1000;transform:translateX(120%);transition:transform .3s}
.toast.show{transform:translateX(0)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <a href="/">← 返回聊天</a>
    <h1>📋 工具调用审计日志</h1>
  </div>

  <div class="summary">
    <div class="stat"><div class="num" id="statTotal">—</div><div class="label">总调用</div></div>
    <div class="stat"><div class="num" id="statSuccess" style="color:var(--success)">—</div><div class="label">成功</div></div>
    <div class="stat"><div class="num" id="statFail" style="color:var(--danger)">—</div><div class="label">失败</div></div>
    <div class="stat"><div class="num" id="statAvg" style="color:var(--warn)">—</div><div class="label">平均耗时(ms)</div></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <select id="toolFilter" onchange="loadLogs()">
        <option value="">全部工具</option>
        <option value="get_time">get_time</option>
        <option value="execute_command">execute_command</option>
        <option value="read_file">read_file</option>
        <option value="write_file">write_file</option>
        <option value="list_processes">list_processes</option>
        <option value="kill_process">kill_process</option>
        <option value="list_services">list_services</option>
        <option value="network_check">network_check</option>
        <option value="system_stats">system_stats</option>
        <option value="search_log">search_log</option>
        <option value="list_dir">list_dir</option>
        <option value="search_kb">search_kb</option>
      </select>
      <button class="btn btn-primary" onclick="loadLogs()"><i class="fas fa-refresh"></i> 刷新</button>
      <button class="btn btn-danger" onclick="clearLogs()" style="margin-left:auto"><i class="fas fa-trash"></i> 清空</button>
    </div>
    <div style="overflow-x:auto;max-height:600px;overflow-y:auto">
      <table>
        <thead><tr><th>时间</th><th>工具</th><th>参数</th><th>结果</th><th>状态</th><th>耗时</th></tr></thead>
        <tbody id="logBody"><tr><td colspan="6" style="text-align:center;color:var(--text-secondary);padding:30px">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function escapeHtml(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function loadLogs(){
  const tool = document.getElementById('toolFilter').value;
  const url = '/audit/list' + (tool ? '?tool_name=' + encodeURIComponent(tool) : '');
  try{
    const res = await fetch(url);
    const data = await res.json();
    const logs = data.logs || [];
    const body = document.getElementById('logBody');
    if(logs.length === 0){
      body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-secondary);padding:30px">暂无审计记录</td></tr>';
    }else{
      body.innerHTML = logs.map(l => `
        <tr>
          <td class="mono" style="white-space:nowrap">${escapeHtml(l.ts)}</td>
          <td><span class="badge" style="background:rgba(74,108,247,.12);color:var(--primary)">${escapeHtml(l.tool_name)}</span></td>
          <td class="mono" style="max-width:180px">${escapeHtml(l.args || '')}</td>
          <td class="result-cell">${escapeHtml((l.result||'').substring(0,200))}${(l.result||'').length>200?'…':''}</td>
          <td>${l.success ? '<span class="badge ok">成功</span>' : '<span class="badge fail">失败</span>'}</td>
          <td class="mono">${l.duration_ms ?? '-'}</td>
        </tr>`).join('');
    }
    // stats
    const ok = logs.filter(l=>l.success).length;
    const fail = logs.length - ok;
    const avg = logs.length ? Math.round(logs.reduce((a,l)=>a+(l.duration_ms||0),0)/logs.length) : 0;
    document.getElementById('statTotal').textContent = logs.length;
    document.getElementById('statSuccess').textContent = ok;
    document.getElementById('statFail').textContent = fail;
    document.getElementById('statAvg').textContent = logs.length ? avg : '-';
  }catch(e){
    document.getElementById('logBody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:30px">加载失败: '+escapeHtml(e.message)+'</td></tr>';
  }
}

async function clearLogs(){
  if(!confirm('确定清空全部审计日志？')) return;
  try{
    const res = await fetch('/audit/clear',{method:'POST',headers:{'Content-Type':'application/json'}});
    const data = await res.json();
    if(data.status==='ok'){ toast('已清空'); loadLogs(); }
    else toast(data.error || '清空失败');
  }catch(e){ toast('清空失败: '+e.message); }
}

// theme init
(function(){
  const saved = localStorage.getItem('dsh_theme_v1');
  const dark = saved !== null ? saved==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(dark) document.documentElement.setAttribute('data-theme','dark');
})();

loadLogs();
</script>
</body>
</html>
